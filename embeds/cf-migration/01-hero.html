<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cf account migration — 8 zones</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #111;
    --panel-border: #222;
    --border: #2a2a2a;
    --dim: #4a4a4a;
    --fg: #e0e0e0;
    --muted: #777;
    --faint: #555;
    --accent: #44aa99;
    --accent-soft: rgba(68,170,153,0.15);
    --source-tint: #6b6b6b;
    --warn: #c79a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.4;
    height: 100%;
    overflow: hidden;
  }
  body { margin: 0; padding: 0; }

  /* frame — fills the iframe completely; .stage is authored at 1040x560 and center-scaled to fit */
  .frame {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--panel);
    container-type: size;
  }

  .stage {
    position: absolute;
    top: 50%; left: 50%;
    width: 1040px;
    height: 560px;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(min(100cqw / 1040px, 100cqh / 560px));
    background: var(--panel);
  }
  .stage::before {
    /* subtle grid */
    content: "";
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .title {
    position: absolute;
    top: 22px; left: 24px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.04em;
  }
  .title strong { color: var(--fg); font-weight: 500; }

  /* Two account panels */
  .account {
    position: absolute;
    top: 80px;
    width: 280px;
    height: 420px;
    padding: 14px 16px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: rgba(255,255,255,0.012);
  }
  .account.source { left: 32px; }
  .account.target { right: 32px; }
  .account .hdr {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }
  .account .label {
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--muted);
  }
  .account.source .label { color: var(--source-tint); }
  .account.target .label { color: var(--accent); }
  .account .sub {
    font-size: 10px;
    color: var(--faint);
    font-style: italic;
  }
  .account .slots {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* chip — shared look for source slots, target slots, and in-flight flyer */
  .chip {
    height: 38px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: rgba(255,255,255,0.015);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--fg);
    white-space: nowrap;
    transition: opacity 0.3s ease, border-color 0.3s ease, background 0.3s ease, color 0.3s ease;
  }
  .chip .favicon {
    width: 14px; height: 14px;
    border-radius: 2px;
    flex-shrink: 0;
    opacity: 0.7;
    filter: grayscale(0.2);
  }
  .chip .name {
    letter-spacing: 0.01em;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chip .tag {
    font-size: 9.5px;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: lowercase;
  }
  .chip.external .tag { color: var(--warn); }
  .chip.external {
    border-style: dashed;
    border-color: rgba(199,154,58,0.35);
  }

  /* source slots start visible, fade out when their zone departs */
  .chip.source {
    opacity: 1;
  }
  .chip.source.gone {
    opacity: 0.12;
    color: var(--faint);
  }
  .chip.source.gone .name { text-decoration: line-through; }

  /* target slots start invisible, fade in on arrival */
  .chip.target {
    opacity: 0;
    border-color: var(--border);
  }
  .chip.target.here {
    opacity: 1;
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 7%, transparent);
    animation: landPulse 500ms cubic-bezier(0.34,1.56,0.64,1) 1;
  }
  .chip.target.here .name { color: var(--fg); }
  .chip.target.here .tag { color: var(--accent); }
  .chip.target.here .favicon { opacity: 1; filter: none; }
  .chip.target.here.external .tag { color: var(--warn); }
  .chip.target.here.external { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 7%, transparent); }
  @keyframes landPulse {
    0%   { transform: scale(0.94); box-shadow: 0 0 0 0 rgba(68,170,153,0.4); }
    60%  { transform: scale(1.03); box-shadow: 0 0 0 6px rgba(68,170,153,0.0); }
    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(68,170,153,0); }
  }

  /* flight area — one flyer animated via JS */
  .flight-area {
    position: absolute;
    inset: 80px 312px 60px 312px;  /* between account panels */
    pointer-events: none;
  }

  .flyer {
    position: absolute;
    top: 0; left: 0;
    width: 250px;
    padding: 10px 12px;
    border: 1px solid var(--accent);
    border-radius: 5px;
    background: color-mix(in srgb, var(--accent) 7%, var(--panel));
    box-shadow:
      0 0 0 4px color-mix(in srgb, var(--accent) 8%, transparent),
      0 0 24px color-mix(in srgb, var(--accent) 25%, transparent),
      0 10px 30px rgba(0,0,0,0.5);
    opacity: 0;
    will-change: transform, opacity;
  }
  .flyer-head {
    display: flex; align-items: center; gap: 8px;
  }
  .flyer .favicon {
    width: 14px; height: 14px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .flyer .name {
    color: var(--fg);
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.01em;
  }
  .flyer .cargo {
    margin-top: 6px;
    color: var(--muted);
    font-size: 10px;
    line-height: 1.5;
  }
  .flyer .cargo .sep { color: var(--faint); margin: 0 4px; }
  .flyer.external { border-style: dashed; border-color: var(--warn); box-shadow: 0 0 0 4px rgba(199,154,58,0.05), 0 0 24px rgba(199,154,58,0.25), 0 8px 28px rgba(0,0,0,0.4); }
  .flyer.external .cargo { color: var(--warn); }

  /* arrow/guide in flight area */
  .guide {
    position: absolute;
    top: 50%;
    left: 10px;
    right: 10px;
    height: 1px;
    background: linear-gradient(to right,
      transparent 0%,
      rgba(255,255,255,0.04) 20%,
      rgba(255,255,255,0.04) 80%,
      transparent 100%);
    transform: translateY(-50%);
  }
  .guide::after {
    content: "→";
    position: absolute;
    top: -9px;
    right: 0;
    color: var(--dim);
    font-size: 12px;
  }

  /* outro */
  .outro {
    position: absolute;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    color: var(--muted);
    font-size: 11px;
    text-align: center;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  .outro.show { opacity: 1; }
  .outro .stat { color: var(--accent); font-weight: 500; }
  .outro .sep { color: var(--dim); margin: 0 10px; }

  /* replay button */
  .replay {
    position: absolute;
    top: 20px; right: 24px;
    font-family: inherit;
    font-size: 10px;
    color: var(--faint);
    background: transparent;
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 3px;
    cursor: pointer;
    letter-spacing: 0.05em;
  }
  .replay:hover { color: var(--fg); border-color: var(--muted); }
</style>
</head>
<body>

<div class="frame">
<div class="stage" id="stage">
  <div class="title"><strong>cf account migration</strong> · 8 zones · 3 days</div>
  <button class="replay" onclick="play()">↻ replay</button>

  <!-- source account -->
  <div class="account source">
    <div class="hdr">
      <div class="label">OLD</div>
      <div class="sub">decommissioning</div>
    </div>
    <div class="slots" id="sourceSlots"></div>
  </div>

  <!-- target account -->
  <div class="account target">
    <div class="hdr">
      <div class="label">NEW</div>
      <div class="sub">personal</div>
    </div>
    <div class="slots" id="targetSlots"></div>
  </div>

  <!-- flight area -->
  <div class="flight-area">
    <div class="guide"></div>
    <div class="flyer" id="flyer">
      <div class="flyer-head">
        <img class="favicon" id="flyer-favicon" alt="">
        <div class="name" id="flyer-name"></div>
      </div>
      <div class="cargo" id="flyer-cargo"></div>
    </div>
  </div>

  <div class="outro" id="outro">
    <span class="stat">7</span> via CF Registrar
    <span class="sep">·</span>
    <span class="stat">1</span> via Namecheap NS change
    <span class="sep">·</span>
    <span class="stat">3 days</span>
    <span class="sep">·</span>
    <span class="stat">zero</span> data loss
  </div>
</div>
</div>

<script>
  const zones = [
    { name: "bufo.uk",           tag: "empty",               cargo: "empty zone · pilot run" },
    { name: "zat.dev",           tag: "3 records",           cargo: "3 records · apex CNAME auto-scan flattened to A" },
    { name: "atproto.audio",     tag: "empty",               cargo: "empty · activation_check needed to unstick" },
    { name: "find-bufo.com",     tag: "4 records",           cargo: "4 records · fly apps · bluesky handle preserved" },
    { name: "ooo.audio",         tag: "1 cname",             cargo: "stale CNAME to a long-forgotten CF account" },
    { name: "alternatebuild.dev",tag: "external",            cargo: "external registrar · NS change at Namecheap", external: true },
    { name: "waow.tech",         tag: "21 rec · 6 pages",    cargo: "21 records · 6 Pages · 3 Workers · 4 KV · 2 D1" },
    { name: "plyr.fm",           tag: "14 GB R2 · apps",     cargo: "17 records · 3 Pages · 11 R2 buckets · 14 GB · Access apps" },
  ];

  // use a consistent favicon service — Google's s2 returns the site's favicon and a neutral globe if missing.
  // size=32 upscaled to 14×14 in CSS for crisp edges on retina.
  function faviconFor(domain) {
    return `https://www.google.com/s2/favicons?domain=${domain}&sz=32`;
  }

  function makeChip(z, role) {
    const el = document.createElement('div');
    el.className = `chip ${role}${z.external ? ' external' : ''}`;
    el.dataset.zone = z.name;
    el.innerHTML = `
      <img class="favicon" src="${faviconFor(z.name)}" alt="" onerror="this.style.visibility='hidden'">
      <span class="name">${z.name}</span>
      <span class="tag">${z.tag}</span>
    `;
    return el;
  }

  // build slots
  const sourceSlots = document.getElementById('sourceSlots');
  const targetSlots = document.getElementById('targetSlots');
  zones.forEach(z => {
    sourceSlots.appendChild(makeChip(z, 'source'));
    targetSlots.appendChild(makeChip(z, 'target'));
  });

  const stage = document.getElementById('stage');
  const flyer = document.getElementById('flyer');
  const flyerName = document.getElementById('flyer-name');
  const flyerCargo = document.getElementById('flyer-cargo');
  const flyerFavicon = document.getElementById('flyer-favicon');
  const outro = document.getElementById('outro');

  // timing per zone (ms) — each phase is clearly separable so text has time to land
  const ENTER_DUR   = 320;    // fade-in at source position
  const SOURCE_HOLD = 650;    // dwell at source so cargo text is readable
  const TRAVEL_DUR  = 2200;   // slow smooth glide across
  const DEST_HOLD   = 280;    // dwell at dest before handoff to target chip
  const EXIT_DUR    = 220;    // fade-out at dest
  const GAP         = 280;    // breathing room between zones

  function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
  const tr = (x, y, s) => `translate(${x}px, ${y}px) scale(${s})`;

  // quadratic bezier at param t
  function qbezier(t, p0, p1, p2) {
    const u = 1 - t;
    return {
      x: u*u*p0.x + 2*u*t*p1.x + t*t*p2.x,
      y: u*u*p0.y + 2*u*t*p1.y + t*t*p2.y,
    };
  }

  async function play() {
    document.querySelectorAll('.chip.source').forEach(c => c.classList.remove('gone'));
    document.querySelectorAll('.chip.target').forEach(c => c.classList.remove('here'));
    outro.classList.remove('show');
    flyer.style.opacity = 0;

    for (let i = 0; i < zones.length; i++) {
      await flyOne(i);
    }
    await wait(300);
    outro.classList.add('show');
  }

  // scale factor from responsive wrapper — getBoundingClientRect returns SCALED coords,
  // but our transform translate() is authored in the pre-scale (1040px) coord space.
  // divide measured deltas by scale to get pre-scale coords.
  function currentScale() {
    const stageEl = document.querySelector('.stage');
    return stageEl.getBoundingClientRect().width / stageEl.offsetWidth;
  }

  async function flyOne(i) {
    const z = zones[i];
    const sourceChip = document.querySelector(`.chip.source[data-zone="${z.name}"]`);
    const targetChip = document.querySelector(`.chip.target[data-zone="${z.name}"]`);

    const s = currentScale() || 1;
    const srcRect = sourceChip.getBoundingClientRect();
    const tgtRect = targetChip.getBoundingClientRect();
    const flightArea = document.querySelector('.flight-area');
    const faRect = flightArea.getBoundingClientRect();

    // content
    flyerName.textContent = z.name;
    flyerCargo.textContent = z.cargo;
    flyerFavicon.src = faviconFor(z.name);
    flyerFavicon.onerror = () => { flyerFavicon.style.visibility = 'hidden'; };
    flyerFavicon.style.visibility = 'visible';
    flyer.classList.toggle('external', !!z.external);

    // measure — divide by scale to get pre-transform (1040-space) dimensions
    flyer.style.opacity = '0';
    flyer.getBoundingClientRect();
    const flyerRect = flyer.getBoundingClientRect();
    const flyerH = (flyerRect.height / s) || 50;
    const flyerW = (flyerRect.width  / s) || 250;

    const startX = 0;
    const startY = (srcRect.top - faRect.top) / s + (srcRect.height / s)/2 - flyerH/2;
    const endX   = faRect.width / s - flyerW;
    const endY   = (tgtRect.top - faRect.top) / s + (tgtRect.height / s)/2 - flyerH/2;

    // bezier control point — lift is scaled to horizontal distance
    const lift = Math.min(50, (endX - startX) * 0.07);
    const ctrl = { x: (startX + endX)/2, y: ((startY + endY)/2) - lift };
    const P0 = { x: startX, y: startY };
    const P2 = { x: endX, y: endY };

    // --- Phase 1: enter + hold at source (reader catches name + cargo) ---
    await flyer.animate([
      { transform: tr(startX, startY, 0.92), opacity: 0 },
      { transform: tr(startX, startY, 1),    opacity: 1 },
      { transform: tr(startX, startY, 1),    opacity: 1 },  // hold
    ], {
      duration: ENTER_DUR + SOURCE_HOLD,
      easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)',  // settle
      fill: 'forwards'
    }).finished;

    // fade the source chip as we depart
    sourceChip.classList.add('gone');

    // --- Phase 2: smooth travel along a quadratic bezier curve ---
    // sample curve at many points so motion is continuously smooth (not V-shaped)
    const N = 32;
    const travelFrames = [];
    for (let k = 0; k <= N; k++) {
      const t = k / N;
      const p = qbezier(t, P0, ctrl, P2);
      // subtle scale breath — peaks at midpoint, settles at end
      const s = 1 + 0.02 * Math.sin(Math.PI * t);
      travelFrames.push({ transform: tr(p.x, p.y, s), opacity: 1 });
    }
    await flyer.animate(travelFrames, {
      duration: TRAVEL_DUR,
      easing: 'cubic-bezier(0.5, 0, 0.5, 1)',  // gentle ease-in-out across whole travel
      fill: 'forwards'
    }).finished;

    // --- Phase 3: dwell at dest + handoff + fade ---
    targetChip.classList.add('here');
    await flyer.animate([
      { transform: tr(endX, endY, 1),    opacity: 1 },
      { transform: tr(endX, endY, 1),    opacity: 1 },  // brief hold while target chip pulses in
      { transform: tr(endX, endY, 0.94), opacity: 0 },
    ], {
      duration: DEST_HOLD + EXIT_DUR,
      easing: 'cubic-bezier(0.4, 0, 0.6, 1)',
      fill: 'forwards'
    }).finished;

    await wait(GAP);
  }

  window.addEventListener('load', () => { play(); });
  stage.addEventListener('click', (e) => {
    if (e.target.tagName !== 'BUTTON') play();
  });

  // --- Leaflet iframe theme context ---
  // when embedded in a Leaflet page, the iframe URL carries bgColor + primaryColor params.
  // retint our palette to match the host page so the embed feels native instead of pasted-in.
  (function(){
    var p = new URLSearchParams(location.search);
    var bg = p.get('parts.page.embed.ctx.bgColor');
    var primary = p.get('parts.page.embed.ctx.primaryColor');
    if (!bg && !primary) return;
    var root = document.documentElement.style;
    function parseHex(h){ h = h.replace('#',''); return { r: parseInt(h.substr(0,2),16), g: parseInt(h.substr(2,2),16), b: parseInt(h.substr(4,2),16) }; }
    function toHex(n){ n = Math.max(0, Math.min(255, Math.round(n))); return n.toString(16).padStart(2,'0'); }
    function shift(h, delta){ var c = parseHex(h); return '#' + toHex(c.r+delta) + toHex(c.g+delta) + toHex(c.b+delta); }
    function luminance(h){ var c = parseHex(h); return (c.r*0.299 + c.g*0.587 + c.b*0.114) / 255; }
    if (bg) {
      var isLight = luminance(bg) > 0.55;
      root.setProperty('--bg',           '#' + bg);
      root.setProperty('--panel',        shift(bg, isLight ? -8  :  8));
      root.setProperty('--panel-border', shift(bg, isLight ? -28 : 24));
      root.setProperty('--border',       shift(bg, isLight ? -42 : 34));
      root.setProperty('--dim',          shift(bg, isLight ? -65 : 48));
      if (isLight) {
        root.setProperty('--fg',         shift(bg, -200));
        root.setProperty('--muted',      shift(bg, -130));
        root.setProperty('--faint',      shift(bg, -90));
        root.setProperty('--source-tint',shift(bg, -110));
      }
    }
    if (primary) {
      root.setProperty('--accent', '#' + primary);
    }
  })();
</script>

</body>
</html>
