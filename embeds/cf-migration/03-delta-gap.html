<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>the R2 delta gap race</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #111;
    --panel-border: #222;
    --border: #2a2a2a;
    --dim: #4a4a4a;
    --fg: #e0e0e0;
    --muted: #888;
    --faint: #555;
    --accent: #44aa99;
    --warn: #c79a3a;
    --danger: #b55;
    --r2: #f6821f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.4;
    height: 100%;
    overflow: hidden;
  }
  body { margin: 0; padding: 0; }

  .frame {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--panel);
    container-type: size;
  }

  .stage {
    position: absolute;
    top: 50%; left: 50%;
    width: 1040px;
    height: 600px;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(min(100cqw / 1040px, 100cqh / 600px));
    background: var(--panel);
  }
  .stage::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .title {
    position: absolute; top: 22px; left: 24px;
    color: var(--muted); font-size: 11px; letter-spacing: 0.04em;
  }
  .title strong { color: var(--fg); font-weight: 500; }

  .replay {
    position: absolute; top: 20px; right: 24px;
    font-family: inherit; font-size: 10px;
    color: var(--faint);
    background: transparent; border: 1px solid var(--border);
    padding: 4px 10px; border-radius: 3px;
    cursor: pointer; letter-spacing: 0.05em;
  }
  .replay:hover { color: var(--fg); border-color: var(--muted); }

  /* bucket panels */
  .bucket {
    position: absolute;
    top: 100px;
    width: 340px;
    height: 280px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: rgba(255,255,255,0.012);
    padding: 14px;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .bucket.source { left: 40px; }
  .bucket.target { right: 40px; }
  .bucket .hdr {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 10px;
  }
  .bucket .label {
    font-size: 10px; color: var(--muted); letter-spacing: 0.1em;
  }
  .bucket.source .label { color: #6b6b6b; }
  .bucket.target .label { color: var(--accent); }
  .bucket .sub {
    font-size: 10px; color: var(--faint);
  }
  .bucket .sub .count { color: var(--fg); font-weight: 500; }
  .bucket.target .sub .count { color: var(--accent); }

  .bucket .r2-tag {
    display: inline-block;
    padding: 1px 6px; border-radius: 2px;
    background: rgba(246,130,31,0.1);
    color: var(--r2);
    font-size: 9px;
    letter-spacing: 0.06em;
  }

  /* inner file grid — objects as dots */
  .files {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(18, 1fr);
    gap: 3px;
    align-content: start;
    padding-top: 4px;
  }
  .file {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 1px;
    background: rgba(255,255,255,0.04);
    border: 1px solid transparent;
    opacity: 0;
    transform: scale(0.6);
    transition: opacity 0.3s ease, transform 0.3s ease, background 0.4s ease, border-color 0.4s ease;
  }
  .file.filled {
    opacity: 1; transform: scale(1);
    background: #2d443f;
  }
  .file.new {
    background: var(--warn);
    border-color: var(--warn);
    box-shadow: 0 0 6px rgba(199,154,58,0.3);
  }
  .file.orphaned {
    background: var(--danger);
    border-color: var(--danger);
    animation: flash 0.6s ease 3;
  }
  @keyframes flash {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.3); }
  }
  .file.just-arrived {
    animation: landPulse 0.5s cubic-bezier(0.34,1.56,0.64,1) 1;
  }
  @keyframes landPulse {
    0%   { transform: scale(0.4); box-shadow: 0 0 0 0 rgba(68,170,153,0.5); }
    60%  { transform: scale(1.3); box-shadow: 0 0 0 4px rgba(68,170,153,0); }
    100% { transform: scale(1); }
  }

  /* routing diagram on top */
  .routing {
    position: absolute;
    top: 100px; left: 400px; right: 400px;
    height: 280px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px;
    pointer-events: none;
  }
  .host-pill {
    font-size: 12px;
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: rgba(0,0,0,0.5);
    color: var(--fg);
    white-space: nowrap;
  }
  .host-pill .host { color: var(--fg); }
  .host-pill .tag {
    display: inline-block; margin-left: 6px;
    font-size: 9px; color: var(--accent);
    letter-spacing: 0.05em;
  }

  .route-svg {
    width: 100%; height: 140px;
    position: relative;
  }

  /* clock/elapsed time */
  .clock {
    position: absolute;
    top: 48px; left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .clock .t { color: var(--accent); font-variant-numeric: tabular-nums; }

  /* phase steps */
  .steps {
    position: absolute;
    top: 50px; right: 170px;
    display: flex; gap: 10px;
  }
  .step-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--border);
    transition: background 0.4s ease, transform 0.4s ease;
  }
  .step-dot.active { background: var(--accent); transform: scale(1.3); }

  /* timeline bar at bottom */
  .timeline {
    position: absolute;
    left: 40px; right: 40px;
    bottom: 72px;
    height: 40px;
    display: flex; align-items: center;
  }
  .timeline-bar {
    flex: 1;
    height: 3px; background: var(--border);
    border-radius: 3px;
    position: relative;
  }
  .timeline-progress {
    position: absolute; top: 0; left: 0;
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    width: 0%;
    transition: width 0.5s linear;
  }
  .timeline-tick {
    position: absolute; top: -3px;
    width: 1px; height: 9px;
    background: var(--dim);
  }
  .timeline-label {
    position: absolute; top: 10px;
    font-size: 9px; color: var(--faint);
    transform: translateX(-50%);
    white-space: nowrap;
  }

  /* caption strip */
  .caption {
    position: absolute;
    bottom: 22px; left: 50%;
    transform: translateX(-50%);
    color: var(--muted);
    font-size: 12px;
    text-align: center;
    max-width: 85%;
    transition: opacity 0.5s ease;
  }
  .caption strong { color: var(--fg); font-weight: 500; }
  .caption .err { color: var(--danger); }
  .caption .ok { color: var(--accent); }
  .caption .warn { color: var(--warn); }
</style>
</head>
<body>

<div class="frame">
<div class="stage" id="stage">
  <div class="title"><strong>the R2 delta gap race</strong> · plyr.fm cutover</div>
  <button class="replay" onclick="play()">↻ replay</button>

  <div class="clock" id="clock">T <span class="t" id="clockT">+00:00</span></div>

  <div class="steps">
    <div class="step-dot" data-step="0"></div>
    <div class="step-dot" data-step="1"></div>
    <div class="step-dot" data-step="2"></div>
    <div class="step-dot" data-step="3"></div>
    <div class="step-dot" data-step="4"></div>
  </div>

  <!-- source bucket -->
  <div class="bucket source">
    <div class="hdr">
      <div>
        <span class="r2-tag">R2</span>
        <span class="label">OLD · audio-prod</span>
      </div>
      <div class="sub"><span class="count" id="srcCount">0</span> files</div>
    </div>
    <div class="files" id="srcFiles"></div>
  </div>

  <!-- target bucket -->
  <div class="bucket target">
    <div class="hdr">
      <div>
        <span class="r2-tag">R2</span>
        <span class="label">NEW · audio-prod</span>
      </div>
      <div class="sub"><span class="count" id="tgtCount">0</span> files</div>
    </div>
    <div class="files" id="tgtFiles"></div>
  </div>

  <!-- routing diagram center -->
  <div class="routing">
    <div class="host-pill">
      <span class="host">audio.plyr.fm</span>
      <span class="tag" id="routeLabel">→ OLD</span>
    </div>
    <svg class="route-svg" viewBox="0 0 240 140" preserveAspectRatio="none">
      <defs>
        <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
        </marker>
      </defs>
      <!-- left curve (points at OLD) — default visible -->
      <path id="arrowOld" d="M 120 10 Q 60 60 10 120" fill="none"
            stroke="#7a7a7a" stroke-width="2" stroke-dasharray="5 4"
            marker-end="url(#arrA)" opacity="1"/>
      <!-- right curve (points at NEW) -->
      <path id="arrowNew" d="M 120 10 Q 180 60 230 120" fill="none"
            stroke="#44aa99" stroke-width="2" stroke-dasharray="5 4"
            marker-end="url(#arrA)" opacity="0"/>
    </svg>
  </div>

  <!-- timeline -->
  <div class="timeline">
    <div class="timeline-bar">
      <div class="timeline-progress" id="tlProgress"></div>
      <div class="timeline-tick" style="left: 20%"></div>
      <div class="timeline-label" style="left: 20%">sync done</div>
      <div class="timeline-tick" style="left: 55%"></div>
      <div class="timeline-label" style="left: 55%">DNS cut</div>
      <div class="timeline-tick" style="left: 75%"></div>
      <div class="timeline-label" style="left: 75%">delta rescue</div>
    </div>
  </div>

  <div class="caption" id="caption"></div>
</div>
</div>

<script>
  // grid capacity: 18 cols × many rows. we'll populate ~90 files total to represent ~789-object bucket
  const INITIAL_FILES = 72;   // files that existed at sync time → goes to both
  const GAP_FILES     = 5;    // files uploaded during the gap → source only, eventually arrive at target
  const TOTAL_CELLS   = 108;  // 18 × 6 rows, enough visual density

  const el = (id) => document.getElementById(id);
  const stage = el('stage');
  const srcFiles = el('srcFiles');
  const tgtFiles = el('tgtFiles');
  const srcCount = el('srcCount');
  const tgtCount = el('tgtCount');
  const routeLabel = el('routeLabel');
  const arrowOld = el('arrowOld');
  const arrowNew = el('arrowNew');
  const tlProgress = el('tlProgress');
  const caption = el('caption');
  const clockT = el('clockT');
  const dots = document.querySelectorAll('.step-dot');

  const captions = [
    "<strong>initial rclone sync</strong> copies every object from OLD R2 to NEW R2.",
    "sync done. but <strong>DNS cut is still an hour away.</strong> users keep uploading.",
    "<strong>DNS cut.</strong> audio.plyr.fm now points at NEW R2. but NEW is missing the last hour's uploads.",
    "requests for recent tracks hit NEW → <span class=\"err\">404</span>. \"Nocturne #1 for Cello won't play.\"",
    "<strong>delta rescue:</strong> second rclone pulls the gap uploads over. <span class=\"ok\">zero data loss.</span>"
  ];

  function buildGrid(container) {
    container.innerHTML = '';
    for (let i = 0; i < TOTAL_CELLS; i++) {
      const d = document.createElement('div');
      d.className = 'file';
      d.dataset.idx = i;
      container.appendChild(d);
    }
  }

  function setStep(n) {
    dots.forEach((d,i) => d.classList.toggle('active', i === n));
    caption.innerHTML = captions[n];
  }

  // timeline progress (0–100)
  function tl(v) { tlProgress.style.width = v + '%'; }

  // clock helper: show simulated elapsed time (format MM:SS) — not real time
  function setClock(minutes) {
    const m = Math.floor(minutes);
    const s = Math.floor((minutes - m) * 60);
    clockT.textContent = `+${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  const wait = (ms) => new Promise(r => setTimeout(r, ms));

  async function play() {
    buildGrid(srcFiles);
    buildGrid(tgtFiles);
    srcCount.textContent = '0';
    tgtCount.textContent = '0';
    routeLabel.textContent = '→ OLD';
    routeLabel.style.color = 'var(--source-tint, #8a8a8a)';
    arrowOld.style.opacity = '1';
    arrowNew.style.opacity = '0';
    tl(0);

    // step 0: initial rclone sync
    setStep(0);
    await wait(500);
    const srcCells = [...srcFiles.children];
    const tgtCells = [...tgtFiles.children];

    // fill source first (represents "these exist at start")
    for (let i = 0; i < INITIAL_FILES; i++) {
      srcCells[i].classList.add('filled');
    }
    srcCount.textContent = INITIAL_FILES;
    await wait(300);

    // sync progress: copy files to target one by one (fast)
    const SYNC_DUR = 2800;
    const perFile = SYNC_DUR / INITIAL_FILES;
    for (let i = 0; i < INITIAL_FILES; i++) {
      tgtCells[i].classList.add('filled', 'just-arrived');
      tgtCount.textContent = i + 1;
      tl(2 + (i / INITIAL_FILES) * 18);  // progress 2% → 20%
      await wait(perFile);
    }
    setClock(0);
    await wait(400);

    // step 1: the gap — users keep uploading during the wait
    setStep(1);
    const gapIndexes = [];
    for (let i = 0; i < GAP_FILES; i++) {
      const idx = INITIAL_FILES + i;
      gapIndexes.push(idx);
      srcCells[idx].classList.add('filled', 'new');
      srcCount.textContent = INITIAL_FILES + i + 1;
      setClock((i + 1) * 8);  // simulated minutes
      tl(20 + ((i + 1) / GAP_FILES) * 35);  // progress 20% → 55%
      await wait(700);
    }
    await wait(900);

    // step 2: DNS cut — audio.plyr.fm now routes to NEW (but NEW is missing gap files!)
    setStep(2);
    arrowOld.style.transition = 'opacity 700ms ease';
    arrowNew.style.transition = 'opacity 700ms ease';
    arrowOld.style.opacity = '0';
    arrowNew.style.opacity = '1';
    routeLabel.textContent = '→ NEW';
    routeLabel.style.color = 'var(--accent)';
    await wait(1400);
    tl(60);

    // step 3: requests 404 → flash red on source-only (gap) files to show what's missing
    setStep(3);
    gapIndexes.forEach(idx => srcCells[idx].classList.add('orphaned'));
    await wait(2200);
    tl(70);
    await wait(600);

    // step 4: delta rescue — gap files copy to target
    setStep(4);
    for (const idx of gapIndexes) {
      srcCells[idx].classList.remove('orphaned');
      srcCells[idx].classList.add('new');  // back to warn color on source
      tgtCells[idx].classList.add('filled', 'new', 'just-arrived');
      tgtCount.textContent = (parseInt(tgtCount.textContent) + 1);
      await wait(360);
    }
    tl(90);
    await wait(600);

    // end state: all green — strip "new" markers so everything reads as normal
    [...gapIndexes].forEach(idx => {
      srcCells[idx].classList.remove('new');
      tgtCells[idx].classList.remove('new');
    });
    tl(100);
    await wait(3000);
  }

  window.addEventListener('load', () => play());
  stage.addEventListener('click', (e) => { if (e.target.tagName !== 'BUTTON') play(); });

  // --- Leaflet iframe theme context ---
  (function(){
    var p = new URLSearchParams(location.search);
    var bg = p.get('parts.page.embed.ctx.bgColor');
    var primary = p.get('parts.page.embed.ctx.primaryColor');
    if (!bg && !primary) return;
    var root = document.documentElement.style;
    function parseHex(h){ h = h.replace('#',''); return { r: parseInt(h.substr(0,2),16), g: parseInt(h.substr(2,2),16), b: parseInt(h.substr(4,2),16) }; }
    function toHex(n){ n = Math.max(0, Math.min(255, Math.round(n))); return n.toString(16).padStart(2,'0'); }
    function shift(h, delta){ var c = parseHex(h); return '#' + toHex(c.r+delta) + toHex(c.g+delta) + toHex(c.b+delta); }
    function luminance(h){ var c = parseHex(h); return (c.r*0.299 + c.g*0.587 + c.b*0.114) / 255; }
    if (bg) {
      var isLight = luminance(bg) > 0.55;
      root.setProperty('--bg',           '#' + bg);
      root.setProperty('--panel',        shift(bg, isLight ? -8  :  8));
      root.setProperty('--panel-border', shift(bg, isLight ? -28 : 24));
      root.setProperty('--border',       shift(bg, isLight ? -42 : 34));
      root.setProperty('--dim',          shift(bg, isLight ? -65 : 48));
      if (isLight) {
        root.setProperty('--fg',         shift(bg, -200));
        root.setProperty('--muted',      shift(bg, -130));
        root.setProperty('--faint',      shift(bg, -90));
      }
    }
    if (primary) {
      root.setProperty('--accent', '#' + primary);
    }
  })();
</script>

</body>
</html>
